name: CI Pipeline

on: 
  pull_request:
    branches:
      - devel
      - stage
      - prod



jobs:
  validate-merge-flow:
    name: validate merge validate
    runs-on: ubuntu-latest

    steps:
      - run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          if [[ "$TARGET" == "devel" && "$SOURCE" != "devel" && "$SOURCE" != "stage" && "$SOURCE" != "prod" ]]; then
            echo "✅ Allowed: $SOURCE → $TARGET"
            exit 0
          fi
          
          # devel goes to stage
          if [[ "$SOURCE" == "devel" && "$TARGET" == "stage" ]]; then
            echo "✅ Allowed: $SOURCE → $TARGET"
            exit 0
          fi
          
          # stage goes to prod
          if [[ "$SOURCE" == "stage" && "$TARGET" == "prod" ]]; then
            echo "✅ Allowed: $SOURCE → $TARGET"
            exit 0
          fi
          
          # Everything else blocked
          echo "❌ Blocked: $SOURCE → $TARGET"
          exit 1


  build:
    name: build and test
    runs-on: ubuntu-latest
    needs: validate-merge-flow

    defaults:
      run:
        working-directory: ./codebase/rdicidr-0.1.0

    steps: 
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: ">=15.0.0 <16.0.0"

    - name: Install dependencies
      run: npm install

    - name: Run linter
      run: npm run lint

    - name: Run formatter
      run: npm run prettier -- --write

    - name: Run tests
      env: 
        CI: true
      run: npm run test

    - name: Build project
      run: npm run build
